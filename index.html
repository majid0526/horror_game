<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💀 هک شده</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    height: 100%;
    overflow-y: auto;
  }

  body {
    font-family: 'Courier New', Tahoma, monospace;
    background: #000000;
    color: #00ff00;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    direction: rtl;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .container {
    background: #0a0a0a;
    border: 2px solid #00ff00;
    border-radius: 8px;
    padding: 12px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    position: relative;
    margin: 10px auto;
  }

  .container.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-8px, -4px); }
    30% { transform: translate(8px, 4px); }
    50% { transform: translate(-6px, 6px); }
    70% { transform: translate(6px, -6px); }
    90% { transform: translate(-4px, 4px); }
  }

  .container.glitch { animation: glitch 0.2s infinite; }
  @keyframes glitch {
    0% { transform: translate(0); filter: hue-rotate(0deg); }
    25% { transform: translate(-3px, 2px); filter: hue-rotate(90deg); }
    50% { transform: translate(3px, -2px); filter: hue-rotate(180deg); }
    75% { transform: translate(-2px, -3px); filter: hue-rotate(270deg); }
    100% { transform: translate(0); filter: hue-rotate(0deg); }
  }

  .container.red-alert {
    border-color: #ff0000;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
  }

  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    border-radius: 8px;
  }

  .start-screen { text-align: center; position: relative; z-index: 2; padding: 10px 0; }

  .skull-icon {
    font-size: 50px; margin-bottom: 5px;
    animation: pulse 1.5s infinite;
    font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 15px #ff0000; }
    50% { transform: scale(1.1); text-shadow: 0 0 30px #ff0000; }
  }

  h1 { color: #ff0000; font-size: 22px; margin-bottom: 8px; text-shadow: 0 0 15px #ff0000; letter-spacing: 2px; }

  .subtitle { color: #00ff00; font-size: 11px; margin-bottom: 15px; min-height: 16px; }

  .name-label { color: #00ff00; font-size: 13px; font-weight: bold; margin-bottom: 6px; display: block; }

  .name-input {
    width: 100%; max-width: 250px; padding: 10px; font-size: 14px;
    font-family: 'Courier New', monospace; background: #000000; color: #00ff00;
    border: 2px solid #00ff00; border-radius: 5px; text-align: center;
    outline: none; margin-bottom: 12px; letter-spacing: 1px;
  }
  .name-input:focus { box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }

  .btn {
    padding: 10px 22px; font-size: 14px; font-weight: bold;
    font-family: 'Courier New', monospace; border: 2px solid;
    border-radius: 5px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.97); }

  .btn-start {
    background: #000000; color: #ff0000; border-color: #ff0000;
    font-size: 15px; padding: 12px 30px;
  }
  .btn-start:hover { background: #ff0000; color: #000000; box-shadow: 0 0 20px #ff0000; }

  .warning { color: #ff0000; font-size: 10px; margin-top: 15px; opacity: 0.8; animation: blink-warning 1s infinite; }
  @keyframes blink-warning { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }

  .game-screen { display: none; position: relative; z-index: 2; }
  .game-screen.active { display: block; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #000000; border: 1px solid #00ff00; padding: 6px 10px;
    border-radius: 5px; margin-bottom: 8px; flex-wrap: wrap; gap: 5px;
  }

  .stat { font-size: 11px; font-weight: bold; }
  .stat-health { color: #ff0000; }
  .stat-fear { color: #ff00ff; }
  .stat-hacked { color: #ff6600; }

  .visual-area {
    background: #000000; border: 2px solid #00ff00; border-radius: 5px;
    height: 80px; margin-bottom: 8px; position: relative; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    font-size: 45px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
  }
  .visual-area.glitch-flash { animation: visual-glitch 0.3s; }
  @keyframes visual-glitch { 0%, 100% { background: #000000; } 50% { background: #ff0000; } }

  .story-text {
    background: #000000; border: 1px solid #00ff00; border-radius: 5px;
    padding: 10px; height: 120px; overflow-y: auto; font-size: 12px;
    line-height: 1.6; margin-bottom: 8px; white-space: pre-wrap;
    color: #00ff00; text-align: right;
  }
  .story-text::-webkit-scrollbar { width: 4px; }
  .story-text::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 2px; }

  .cursor-blink::after { content: "▊"; color: #00ff00; animation: blink 0.8s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .choices { display: flex; flex-direction: column; gap: 5px; }

  .choice-btn {
    padding: 8px 12px; font-size: 12px; font-weight: bold;
    font-family: 'Courier New', monospace; background: #000000; color: #00ff00;
    border: 2px solid #00ff00; border-radius: 5px; cursor: pointer;
    text-align: right; transition: all 0.2s; letter-spacing: 1px;
  }
  .choice-btn:hover { background: #00ff00; color: #000000; box-shadow: 0 0 15px #00ff00; }
  .choice-btn:active { transform: scale(0.98); }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    h1 { font-size: 18px; }
    .skull-icon { font-size: 40px; }
    .visual-area { height: 70px; font-size: 38px; }
    .story-text { font-size: 11px; padding: 8px; height: 100px; }
    .choice-btn { font-size: 11px; padding: 7px 10px; }
    .top-bar { font-size: 10px; padding: 5px; }
    .stat { font-size: 10px; }
    .name-input { padding: 8px; font-size: 12px; }
    .btn-start { font-size: 13px; padding: 10px 22px; }
  }
</style>
</head>
<body>
<div class="container" id="container">
  <div class="scanlines"></div>

  <div class="start-screen" id="startScreen">
    <div class="skull-icon">💀</div>
    <h1>هک شده</h1>
    <div class="subtitle" id="startSubtitle">در حال بارگذاری...</div>
    <label class="name-label">اسمت چیه؟</label>
    <input type="text" class="name-input" id="nameInput" placeholder="اسمت رو بنویس...">
    <button class="btn btn-start" id="startBtn">▶ شروع</button>
    <div class="warning">⚠️ هشدار: صداهای بلند و تصاویر ترسناک</div>
  </div>

  <div class="game-screen" id="gameScreen">
    <div class="top-bar">
      <span class="stat stat-health" id="healthLabel">❤️ 100</span>
      <span class="stat stat-fear" id="fearLabel">😱 0</span>
      <span class="stat stat-hacked" id="hackedLabel">💀 0%</span>
    </div>
    <div class="visual-area" id="visualArea">🖥️</div>
    <div class="story-text" id="storyText"></div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<script>
window.onload = function() {
  var container = document.getElementById("container");
  var startScreen = document.getElementById("startScreen");
  var gameScreen = document.getElementById("gameScreen");
  var startSubtitle = document.getElementById("startSubtitle");
  var nameInput = document.getElementById("nameInput");
  var startBtn = document.getElementById("startBtn");
  var storyText = document.getElementById("storyText");
  var choicesEl = document.getElementById("choices");
  var visualArea = document.getElementById("visualArea");
  var healthLabel = document.getElementById("healthLabel");
  var fearLabel = document.getElementById("fearLabel");
  var hackedLabel = document.getElementById("hackedLabel");

  var playerName = "";
  var health = 100;
  var fear = 0;
  var hacked = 0;
  var typingTimer = null;
  var audioCtx = null;

  var startMessages = ["در حال اتصال...", "در حال نفوذ...", "دسترسی غیرمجاز...", "خطر شناسایی شد...", "سیستم در خطر است!"];
  var msgIndex = 0;
  setInterval(function() {
    startSubtitle.textContent = startMessages[msgIndex];
    msgIndex = (msgIndex + 1) % startMessages.length;
  }, 1500);

  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }

  function playBeep(freq, duration, volume, type) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq; osc.type = type || "sine";
      gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
      osc.start(); osc.stop(audioCtx.currentTime + duration / 1000);
    } catch(e) {}
  }

  function playScarySound() {
    playBeep(100, 300, 0.3, "sawtooth");
    setTimeout(function() { playBeep(80, 400, 0.3, "sawtooth"); }, 200);
  }
  function playGlitchSound() {
    for (var i = 0; i < 5; i++) {
      setTimeout(function() { playBeep(200 + Math.random() * 800, 50, 0.15, "square"); }, i * 60);
    }
  }
  function playHeartbeat() {
    playBeep(60, 100, 0.3);
    setTimeout(function() { playBeep(50, 150, 0.3); }, 150);
  }
  function playScream() {
    playBeep(800, 200, 0.3, "sawtooth");
    setTimeout(function() { playBeep(600, 200, 0.3, "sawtooth"); }, 100);
    setTimeout(function() { playBeep(400, 300, 0.3, "sawtooth"); }, 200);
  }

  function shakeScreen() {
    container.classList.add("shake");
    setTimeout(function() { container.classList.remove("shake"); }, 300);
  }
  function glitchScreen() {
    container.classList.add("glitch");
    setTimeout(function() { container.classList.remove("glitch"); }, 400);
  }
  function redAlert() {
    container.classList.add("red-alert");
    setTimeout(function() { container.classList.remove("red-alert"); }, 1000);
  }
  function flashVisual() {
    visualArea.classList.add("glitch-flash");
    setTimeout(function() { visualArea.classList.remove("glitch-flash"); }, 300);
  }

  function updateStats() {
    healthLabel.textContent = "❤️ " + health;
    fearLabel.textContent = "😱 " + fear;
    hackedLabel.textContent = "💀 " + hacked + "%";
  }

  function typeText(text, callback) {
    if (typingTimer) clearInterval(typingTimer);
    storyText.textContent = "";
    storyText.classList.add("cursor-blink");
    var i = 0;
    typingTimer = setInterval(function() {
      if (i < text.length) {
        storyText.textContent += text[i];
        storyText.scrollTop = storyText.scrollHeight;
        i++;
      } else {
        clearInterval(typingTimer);
        typingTimer = null;
        storyText.classList.remove("cursor-blink");
        if (callback) callback();
      }
    }, 25);
  }

  function showChoices(choices) {
    choicesEl.innerHTML = "";
    choices.forEach(function(choice) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = choice.text;
      btn.onclick = function() { playScene(choice.next); };
      choicesEl.appendChild(btn);
    });
  }

  function setVisual(emoji) { visualArea.textContent = emoji; }

  function playScene(sceneId) {
    if (sceneId === "start") {
      setVisual("🖥️");
      playBeep(800, 100);
      typeText("ساعت ۲ نصفه‌شبه. " + playerName + " توی اتاقت نشستی و داری به صفحه‌ی کامپیوترت نگاه می‌کنی.\n\nیه ایمیل مشکوک اومده: «سیستم شما هک شده. برای نجات، روی این لینک کلیک کنید.»\n\nچیکار می‌کنی؟", function() {
        showChoices([
          { text: "🔗 روی لینک کلیک می‌کنم", next: "click_link" },
          { text: "🗑️ ایمیل رو پاک می‌کنم", next: "delete_email" }
        ]);
      });
    }
    else if (sceneId === "click_link") {
      playGlitchSound(); glitchScreen(); hacked += 20; fear += 15; updateStats(); setVisual("💀");
      typeText("روی لینک کلیک می‌کنی. صفحه‌ی کامپیوترت شروع می‌کنه به لرزیدن.\n\nنور صفحه قرمز می‌شه. یه متن ظاهر می‌شه:\n\n«به دام افتادی!»\n\nصدای خنده‌ی خش‌داری از اسپیکر میاد...", function() {
        showChoices([
          { text: "🔌 کابل برق رو بکشم", next: "unplug" },
          { text: "⌨️ هکرو پیدا کنم", next: "find_hacker" },
          { text: "🏃 فرار کنم", next: "run_away" }
        ]);
      });
    }
    else if (sceneId === "delete_email") {
      setVisual("📧");
      typeText("ایمیل رو پاک می‌کنی. نفس راحتی می‌کشی.\n\nولی یهو، صفحه‌ی کامپیوترت خودش روشن می‌شه!\n\nمتن قرمز:\n\n«فکر کردی با پاک کردن ایمیل، من می‌رم؟»", function() {
        showChoices([
          { text: "🔌 کابل برق رو بکشم", next: "unplug" },
          { text: "⌨️ هکرو پیدا کنم", next: "find_hacker" },
          { text: "🏃 فرار کنم", next: "run_away" }
        ]);
      });
    }
    else if (sceneId === "unplug") {
      playScarySound(); shakeScreen(); hacked += 15; fear += 20; updateStats(); setVisual("🔌");
      typeText("کابل برق رو می‌کشی. صفحه خاموش می‌شه.\n\nصدای یه نفس کشیدن از پشتت میاد.\n\nبرمی‌گردی. هیچی نیست.\n\nیهو، صفحه خودش روشن می‌شه!", function() {
        showChoices([
          { text: "👀 به صفحه نگاه می‌کنم", next: "look_screen" },
          { text: "🏃 فرار می‌کنم", next: "run_away" }
        ]);
      });
    }
    else if (sceneId === "look_screen") {
      playScream(); flashVisual(); glitchScreen(); fear += 30; hacked += 25; updateStats(); setVisual("👹");
      typeText("یه صورت ترسناک روی صفحه ظاهر می‌شه!\n\nچشماش قرمز می‌درخشه. یه صدای جیغ از اسپیکر میاد!\n\n«... تو ... نمی‌تونی ... فرار کنی ...»", function() {
        showChoices([
          { text: "🔌 کابل رو بکشم", next: "unplug" },
          { text: "⌨️ هکرو پیدا کنم", next: "find_hacker" },
          { text: "🏃 فرار کنم", next: "run_away" }
        ]);
      });
    }
    else if (sceneId === "find_hacker") {
      playGlitchSound(); hacked += 10; updateStats(); setVisual("🔍");
      typeText("شروع می‌کنی به تایپ کردن.\n\nتوی کدها، یه آدرس IP پیدا می‌کنی. ولی وقتی کلیک می‌کنی...\n\n«دنبال من می‌گردی؟ من همینجام...»", function() {
        showChoices([
          { text: "🔌 کابل رو بکشم", next: "unplug" },
          { text: "🏃 فرار کنم", next: "run_away" },
          { text: "💬 حرف بزنم", next: "talk_hacker" }
        ]);
      });
    }
    else if (sceneId === "talk_hacker") {
      fear += 15; updateStats(); setVisual("💬");
      typeText("«تو کی هستی؟»\n\n«من ... یه چیز دیگه‌ام ... نه انسان ... نه روح ...»\n\n«... هر چی بیشتر بترسی ... من قوی‌تر می‌شم ...»", function() {
        showChoices([
          { text: "😨 فرار کنم", next: "run_away" },
          { text: "💪 نترسم", next: "stay_calm" },
          { text: "🔌 کابل رو بکشم", next: "unplug" }
        ]);
      });
    }
    else if (sceneId === "stay_calm") {
      health -= 10; fear -= 10; updateStats(); setVisual("😌");
      typeText("سعی می‌کنی آروم باشی.\n\nموجود ضعیف‌تر می‌شه.\n\n«... نه ... چرا ... نمی‌ترسی ...»", function() {
        showChoices([
          { text: "💪 ادامه بده", next: "stay_calm_final" },
          { text: "🏃 فرار کن", next: "run_away" }
        ]);
      });
    }
    else if (sceneId === "stay_calm_final") {
      playBeep(1500, 200); hacked = Math.max(0, hacked - 30); updateStats(); setVisual("✨");
      typeText("آروم می‌مونی. موجود ضعیف‌تر می‌شه.\n\nصفحه خاموش می‌شه. همه چیز آروم می‌شه.\n\n🔚 پایان: نجات\n\nتو موجود رو شکست دادی.", function() {
        showChoices([
          { text: "🔄 دوباره بازی کن", next: "restart" },
          { text: "🚪 خروج", next: "exit" }
        ]);
      });
    }
    else if (sceneId === "run_away") {
      playHeartbeat(); shakeScreen(); health -= 20; fear += 20; updateStats(); setVisual("🏃");
      if (Math.random() < 0.5) {
        typeText("از اتاق فرار می‌کنی.\n\nولی چراغ‌ها خاموش می‌شن.\n\n«... تو ... نمی‌تونی ... فرار کنی ...»", function() {
          showChoices([
            { text: "🚪 از خونه بیرون", next: "escape_house" },
            { text: "🔌 برگرد", next: "unplug" }
          ]);
        });
      } else {
        typeText("می‌دوی سمت در خروجی. می‌پری بیرون.\n\nتوی پنجره، یه سایه ایستاده و بهت نگاه می‌کنه...\n\n🔚 پایان: فرار", function() {
          showChoices([
            { text: "🔄 دوباره", next: "restart" },
            { text: "🚪 خروج", next: "exit" }
          ]);
        });
      }
    }
    else if (sceneId === "escape_house") {
      playScream(); glitchScreen(); redAlert(); fear += 30; hacked += 20; updateStats(); setVisual("👻");
      typeText("از خونه بیرون می‌ری. گوشیت زنگ می‌خوره.\n\nپیام: «من توی گوشیت هم هستم...»\n\nصفحه‌ی گوشی خاموش می‌شه.", function() {
        showChoices([
          { text: "📱 گوشی رو خاموش کن", next: "turn_off_phone" },
          { text: "🏃 باز فرار کن", next: "run_forever" }
        ]);
      });
    }
    else if (sceneId === "turn_off_phone") {
      hacked = Math.max(0, hacked - 20); updateStats(); setVisual("📱");
      typeText("گوشی رو خاموش می‌کنی.\n\nاز توی خونه، صدای جیغ میاد!\n\nبعد از چند ثانیه، همه چیز ساکت می‌شه.\n\n🔚 پایان: سکوت", function() {
        showChoices([
          { text: "🔄 دوباره", next: "restart" },
          { text: "🚪 خروج", next: "exit" }
        ]);
      });
    }
    else if (sceneId === "run_forever") {
      playHeartbeat(); shakeScreen(); health -= 30; fear += 25; hacked += 30; updateStats(); setVisual("💀");
      typeText("می‌دوی. هر جا می‌ری، صدای نفس میاد.\n\nهمه چیز دورت می‌چرخه. می‌افتی زمین.\n\nوقتی چشمات رو باز می‌کنی، دوباره توی اتاقتی.\n\n🔚 پایان: حلقه", function() {
        showChoices([
          { text: "🔄 دوباره", next: "restart" },
          { text: "🚪 خروج", next: "exit" }
        ]);
      });
    }
    else if (sceneId === "restart") {
      health = 100; fear = 0; hacked = 0; updateStats(); playScene("start");
    }
    else if (sceneId === "exit") {
      setVisual("✨");
      typeText("ممنون که بازی کردی! 💀");
      choicesEl.innerHTML = "";
    }
  }

  startBtn.onclick = function() {
    var name = nameInput.value.trim();
    if (!name) {
      nameInput.style.borderColor = "#ff0000";
      nameInput.placeholder = "اسمت رو بنویس!";
      return;
    }
    playerName = name;
    initAudio();
    startScreen.style.display = "none";
    gameScreen.classList.add("active");
    updateStats();
    playScene("start");
  };

  nameInput.onkeydown = function(e) { if (e.key === "Enter") startBtn.click(); };
  nameInput.oninput = function() { nameInput.style.borderColor = "#00ff00"; };
};
</script>
</body>
</html>
